name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: APK di debug
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Componenti SDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      # Senza gradle-version: usa quella dichiarata dal wrapper del progetto,
      # cosi' locale e CI compilano con lo stesso identico Gradle.
      # L'azione si occupa anche della cache delle dipendenze.
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Permessi di esecuzione
        run: chmod +x gradlew

      # Senza --stacktrace: su un errore di compilazione stampava duecento
      # righe di interni Gradle, e le righe "e: file://..." che dicono
      # davvero cosa non va finivano fuori dalla coda leggibile del log.
      - name: Test unitari
        run: ./gradlew testDebugUnitTest

      - name: Compila APK di debug
        run: ./gradlew assembleDebug

      # Pubblicato subito, prima della release: se R8 inciampa, l'APK di debug
      # di questo commit deve restare scaricabile comunque.
      - name: Pubblica APK
        uses: actions/upload-artifact@v4
        with:
          name: myacamperlife-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error

      # La chiave di firma arriva dai segreti del repository, in base64 perche'
      # un archivio di chiavi e' un file binario. Se i segreti non ci sono la
      # release esce non firmata, e il passo dopo serve comunque: e' quello che
      # verifica R8, e un `-keep` mancante si vede solo compilando la release.
      - name: Chiave di firma, se c'e'
        id: chiave
        env:
          ARCHIVIO_BASE64: ${{ secrets.MYA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ARCHIVIO_BASE64" ]; then
            printf '%s' "$ARCHIVIO_BASE64" | base64 -d > "$RUNNER_TEMP/mya.jks"
            echo "archivio=$RUNNER_TEMP/mya.jks" >> "$GITHUB_OUTPUT"
            echo "Chiave trovata: la release sara' firmata."
          else
            echo "Nessuna chiave nei segreti: la release restera' non firmata."
          fi

      - name: Compila APK di release
        env:
          MYA_KEYSTORE: ${{ steps.chiave.outputs.archivio }}
          MYA_KEYSTORE_PASSWORD: ${{ secrets.MYA_KEYSTORE_PASSWORD }}
          MYA_KEY_ALIAS: ${{ secrets.MYA_KEY_ALIAS }}
          MYA_KEY_PASSWORD: ${{ secrets.MYA_KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      # L'archivio decifrato non sopravvive al job nemmeno se qualcosa e'
      # fallito: `always()` vale anche quando la compilazione cade.
      - name: Cancella la chiave dal runner
        if: always()
        run: rm -f "$RUNNER_TEMP/mya.jks"

      - name: Pubblica referto dei test se falliscono
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: referto-test
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Pubblica APK di release
        uses: actions/upload-artifact@v4
        with:
          name: myacamperlife-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90
          if-no-files-found: error

      # La mappa dei nomi offuscati. Senza, una traccia di crash della release
      # e' illeggibile; e vale solo per **quell'** APK, quindi va conservata
      # assieme a lui.
      - name: Pubblica la mappa di R8
        uses: actions/upload-artifact@v4
        with:
          name: mappa-r8
          path: app/build/outputs/mapping/release/
          retention-days: 90
          if-no-files-found: warn
